-- Hyprland 0.56+ Lua (hyprlang windowrule= lines are ignored).
-- Keep in sync with ~/.config/hypr/hyprland.lua.
-- Size is locked to 920x720 while floating via set_prop (not a min=max
-- window rule) so Super+T can still tile. Do not resize again on
-- window.open — the rule already set 920x720.
o.window("^stream\\.music\\.Player$", {
  tag = "-default-opacity",
  opacity = "1 1",
  opaque = true,
  float = true,
  center = true,
  size = { 920, 720 },
})
