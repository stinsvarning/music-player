-- Hyprland 0.56+ Lua (hyprlang windowrule= lines are ignored).
-- Keep in sync with ~/.config/hypr/hyprland.lua.
-- Opens as a centered 1180x880 float, the player's own size. Super+F
-- (or F11 in the app) fullscreens it. Hypr draws the square 2px border.
o.window("^stream\\.music\\.Player$", {
  tag = "-default-opacity",
  opacity = "1 1",
  opaque = true,
  rounding = 0,
  no_max_size = true,
  float = true,
  center = true,
  size = { 1180, 880 },
})
